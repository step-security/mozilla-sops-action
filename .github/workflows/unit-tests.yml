name: 'Run unit tests.'
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    permissions:
      contents: read  # for actions/checkout to fetch code
    strategy:
      matrix:
        os: ${{ github.actor == 'dependabot[bot]' && fromJson('["ubuntu-latest"]') || fromJson('["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Install and test
        run: |
          npm ci
          npm run typecheck
          npm test

  bundle:
    name: Verify dist/index.js is up to date
    permissions:
      contents: read  # for actions/checkout to fetch code
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json

      - name: Rebuild bundle
        run: |
          npm ci
          npm run build

      - name: Fail if the committed bundle is stale
        run: |
          git diff --exit-code -- dist/ || {
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          }

      - name: Fail if the bundle contains bare require() calls
        # require is undefined in an ESM bundle; see rollup.config.js.
        run: |
          if grep -nE '\brequire\(' dist/index.js; then
            echo "::error::dist/index.js contains require() calls, which fail at runtime in ESM."
            exit 1
          fi
